name: Bootstrap P0 backports from PR

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/p0-backports') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 1 && github.event.comment.body == '/bootstrap-p0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-backports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore maintained sources and apply bundle backports
        shell: bash
        run: |
          python - <<'PY' > /tmp/p0-bootstrap.b64
          import re
          from pathlib import Path
          text = Path('.github/workflows/bootstrap-p0.yml').read_text()
          match = re.search(r"echo '([^']+)' \\| base64 -d", text)
          if not match:
              raise SystemExit('embedded P0 bootstrap archive not found')
          print(match.group(1))
          PY
          base64 -d /tmp/p0-bootstrap.b64 | tar -xz
          npm run verify:p0
          rm -f .github/workflows/bootstrap-p0.yml .github/workflows/bootstrap-p0-pr.yml
      - name: Commit the complete P0 iteration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: backport three P0 reliability fixes"
          git push origin HEAD:feature/p0-backports
