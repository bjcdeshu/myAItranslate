name: Fix YouTube PiP Trusted Types compatibility v2

on:
  push:
    branches:
      - feature/youtube-pip
    paths:
      - .github/workflows/fix-youtube-pip-trusted-types-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/youtube-pip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace string SVG injection with DOM construction
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('youtube-pip.js')
          s = p.read_text()
          s = s.replace("button.innerHTML = buildButtonIcon(false);", "button.appendChild(createButtonIcon(false));")
          s = s.replace("button.innerHTML = buildButtonIcon(active);", "button.replaceChildren(createButtonIcon(active));")

          replacement = '''    function createButtonIcon(active) {
                const namespace = 'http://www.w3.org/2000/svg';
                const accent = active ? '#ff6b9a' : '#ffffff';
                const svg = document.createElementNS(namespace, 'svg');
                for (const [name, value] of Object.entries({
                  viewBox: '0 0 36 36',
                  width: '100%',
                  height: '100%',
                  'aria-hidden': 'true',
                  focusable: 'false',
                })) {
                  svg.setAttribute(name, value);
                }

                const frame = document.createElementNS(namespace, 'rect');
                for (const [name, value] of Object.entries({
                  x: '4', y: '7', width: '28', height: '21', rx: '2.5',
                  fill: 'none', stroke: accent, 'stroke-width': '2',
                })) frame.setAttribute(name, value);

                const inset = document.createElementNS(namespace, 'rect');
                for (const [name, value] of Object.entries({
                  x: '19', y: '17', width: '11', height: '8', rx: '1.5', fill: accent,
                })) inset.setAttribute(name, value);

                const lines = document.createElementNS(namespace, 'path');
                for (const [name, value] of Object.entries({
                  d: 'M8.5 13.5h8M8.5 18h7', stroke: accent,
                  'stroke-width': '1.8', 'stroke-linecap': 'round',
                })) lines.setAttribute(name, value);

                svg.append(frame, inset, lines);
                return svg;
              }
          '''

          if 'function buildButtonIcon(active)' in s:
              pattern = r"    function buildButtonIcon\(active\) \{.*?^    \}\n"
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f'expected one icon function, replaced {count}')
          elif 'function createButtonIcon(active)' not in s:
              raise SystemExit('icon function not found')

          if 'innerHTML' in s or 'buildButtonIcon' in s:
              raise SystemExit('unsafe icon injection remains')
          p.write_text(s)
          PY
          node --check youtube-pip.js
          node --test maintenance/tests/youtube-pip.test.mjs
          npm run verify:p0
      - name: Commit compatibility fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-youtube-pip-trusted-types.yml
          rm -f .github/workflows/fix-youtube-pip-trusted-types-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(youtube): avoid Trusted Types SVG injection"
          git push origin HEAD:feature/youtube-pip
