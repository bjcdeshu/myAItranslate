name: Bootstrap P0 backports

on:
  push:
    branches: [feature/p0-backports]
    paths: [.github/workflows/bootstrap-p0.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore maintained sources and apply bundle backports
        shell: bash
        run: |
          echo '' | base64 -d | tar -xz
          npm run verify:p0
          rm -f .github/workflows/bootstrap-p0.yml
      - name: Commit the complete P0 iteration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: backport three P0 reliability fixes"
          git push origin HEAD:feature/p0-backports
