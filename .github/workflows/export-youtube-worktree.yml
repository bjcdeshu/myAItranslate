name: Export YouTube worktree

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/youtube-pip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Pack repository worktree
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/myAItranslate-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: myAItranslate-worktree
          path: /tmp/myAItranslate-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
